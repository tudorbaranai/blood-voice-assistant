<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood</title>
<style>
  :root {
    --bg: #07070a;
    --heard: #8a8a96;
    --answer: #f2f2f5;
    --status: #b3001b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none;
               font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #text { position: fixed; left: 8vw; right: 8vw; top: 66vh; text-align: center; }
  #status { color: var(--status); font-size: 1.6vh; letter-spacing: .35em; text-transform: uppercase;
            margin-bottom: 2.2vh; opacity: .9; min-height: 2vh; }
  #heard { color: var(--heard); font-size: 2.6vh; font-style: italic; min-height: 3.4vh; }
  #answer { color: var(--answer); font-size: 3.6vh; line-height: 1.35; margin-top: 1.6vh; }
  .fade { transition: opacity .4s ease; }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="text">
  <div id="status" class="fade"></div>
  <div id="heard" class="fade"></div>
  <div id="answer" class="fade"></div>
</div>
<script>
// Blood sends: {state: idle|wake|listening|thinking|speaking, heard, answer, level 0..1}
const $ = id => document.getElementById(id);
const canvas = $("orb"), ctx = canvas.getContext("2d");
let state = "idle", level = 0, ripples = [];
const STATUS = { idle: "", wake: "", listening: "Listening", thinking: "Thinking", speaking: "" };

function setText(el, text) {
  if (el.textContent === text) return;
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = text; el.style.opacity = 1; }, 180);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.level !== undefined) level = m.level;
    if (m.state) { state = m.state; setText($("status"), STATUS[state] || ""); }
    if (m.heard !== undefined) setText($("heard"), m.heard ? `“${m.heard}”` : "");
    if (m.answer !== undefined) setText($("answer"), m.answer || "");
  };
  ws.onclose = () => setTimeout(connect, 1000);   // Blood restarted: reconnect
}
connect();

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", resize); resize();

// Each state has a look; the orb glides between them instead of jumping.
const LOOKS = {
  idle:      { glow: .35, size: .92, wobble: .03, speed: 1.0 },
  wake:      { glow: 1.0, size: 1.08, wobble: .05, speed: 3.0 },
  listening: { glow: .85, size: 1.0, wobble: .04, speed: 3.0 },
  thinking:  { glow: .7, size: .9,  wobble: .02, speed: 2.0 },
  speaking:  { glow: .95, size: 1.0, wobble: .03, speed: 2.5 },
};
const now = { glow: .35, size: .92, wobble: .03, speed: 1.0 };
let spin = 0, last = performance.now(), smooth = 0;

function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  const want = LOOKS[state] || LOOKS.idle;
  for (const k in now) now[k] += (want[k] - now[k]) * Math.min(1, dt * 4);
  smooth += (level - smooth) * Math.min(1, dt * 12);
  if (state !== "listening" && state !== "speaking") level *= .9;
  spin += dt * (state === "thinking" ? 2.4 : .3);

  const W = canvas.width, H = canvas.height, cx = W / 2, cy = H * .38;
  const R = Math.min(W, H) * .16;
  const r = R * (now.size + now.wobble * Math.sin(t / 1000 * now.speed) + .35 * smooth);
  ctx.clearRect(0, 0, W, H);

  // wide soft glow
  const halo = ctx.createRadialGradient(cx, cy, r * .2, cx, cy, r * 2.6);
  halo.addColorStop(0, `rgba(200, 10, 40, ${.30 * now.glow})`);
  halo.addColorStop(1, "rgba(200, 10, 40, 0)");
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  // ripples while Blood speaks
  if (state === "speaking" && smooth > .18 && Math.random() < dt * 6) ripples.push({ r: r, a: .5 * smooth + .15 });
  ripples = ripples.filter(p => p.a > .01);
  for (const p of ripples) {
    p.r += dt * R * 1.4; p.a *= Math.pow(.25, dt);
    ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 60, 80, ${p.a})`; ctx.lineWidth = 2 * devicePixelRatio; ctx.stroke();
  }

  // the orb itself
  const core = ctx.createRadialGradient(cx - r * .25, cy - r * .3, r * .05, cx, cy, r);
  core.addColorStop(0, `rgba(255, 150, 160, ${.55 + .45 * now.glow})`);
  core.addColorStop(.35, `rgba(225, 20, 50, ${.6 + .4 * now.glow})`);
  core.addColorStop(1, `rgba(90, 0, 15, ${.5 + .4 * now.glow})`);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = core; ctx.fill();

  // thinking: three arcs circling the orb
  if (state === "thinking") {
    ctx.lineWidth = 3 * devicePixelRatio; ctx.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const a = spin * (1 + i * .25) + i * 2.1;
      ctx.beginPath(); ctx.arc(cx, cy, r * (1.25 + i * .12), a, a + 1.1);
      ctx.strokeStyle = `rgba(255, 70, 90, ${.75 - i * .2})`; ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
